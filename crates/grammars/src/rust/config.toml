name = "Rust"
grammar = "rust"
path_suffixes = ["rs"]
modeline_aliases = ["rs", "rustic"]
line_comments = ["// ", "/// ", "//! "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "r#\"", end = "\"#", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "r##\"", end = "\"##", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "r###\"", end = "\"###", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "<", end = ">", close = false, newline = true, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "`", end = "`", close = false, newline = false, not_in = ["string"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
collapsed_placeholder = " /* ... */ "
debuggers = ["CodeLLDB", "GDB"]
block_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
documentation_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }

# The enter indentation of VS Code's Rust language configuration.
[on_enter]
brackets = [["{", "}"], ["[", "]"], ["(", ")"]]

[on_enter.indentation_rules]
increase_indent_pattern = '''^.*\{[^}"']*$|^.*\([^\)"']*$'''
decrease_indent_pattern = '^\s*(\s*/[*].*[*]/\s*)*[})]'

# Continue a line comment when pressing enter in the middle of it.
[[on_enter.rules]]
before_text = '^\s*//\s*\S|\s//\s+\S'
after_text = '^(?!\s*$)'
indent = "none"
append_text = "// "
